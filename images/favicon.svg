<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid ground so the icon has presence on any tab bar. Three nodes, not
       six, so each one still reads at 16px. Node colours are the whakapapa
       palette lifted for contrast against the terracotta. -->
  <rect width="32" height="32" rx="7" fill="#A84536"/>
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="16" y1="16" x2="16" y2="7.5"/>
    <line x1="16" y1="16" x2="8.5" y2="22"/>
    <line x1="16" y1="16" x2="23.5" y2="22"/>
  </g>
  <circle cx="16" cy="7.5" r="3.4" fill="#7FC4C6"/>
  <circle cx="8.5" cy="22" r="3.4" fill="#A8C48A"/>
  <circle cx="23.5" cy="22" r="3.4" fill="#F0C34B"/>
  <circle cx="16" cy="16" r="4.6" fill="#ffffff"/>
</svg>
